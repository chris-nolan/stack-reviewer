[package]
name = "stack-reviewer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stack_reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tokio = { version = "1.54.1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "net", "time"] }
which = "8.0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
axum = "0.8"
base64 = "0.23.1"
uuid = { version = "1.29.2", features = ["v4"] }
tauri-plugin-notification = "2"
rusqlite = { version = "0.32", features = ["bundled"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
