name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Release commits skip the build (see below), so give them their own group: otherwise their
  # empty run would cancel a real build still running on the branch.
  group: "${{ startsWith(github.event.head_commit.message, 'chore: release v') && format('build-skip-{0}', github.sha) || format('build-{0}', github.ref) }}"
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # A release commit only bumps the version, and its tag's release workflow builds the same code,
    # so don't build it twice. (head_commit is unset for pull requests, so they always build.)
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Node is only needed at runtime for the Claude ACP adapter (npx), but keep it available for tooling.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p .

      - name: Frontend tests
        run: bunx vitest run

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # A debug build is enough to prove the app compiles and bundles on each OS (no signing set up yet).
      # MSI versions can't carry a pre-release label (0.1.1-beta.2), so while the app version has one,
      # Windows bundles only the NSIS setup.exe, as the release workflow does for pre-releases.
      - name: Build app (debug)
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          args=""
          if [ "$RUNNER_OS" = "Windows" ] && [[ "$version" == *-* ]]; then args="--bundles nsis"; fi
          echo "version $version ${args:+($args)}"
          bun run tauri build --debug $args

      - uses: actions/upload-artifact@v4
        with:
          name: stack-reviewer-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/debug/bundle/dmg/*.dmg
            src-tauri/target/debug/bundle/macos/*.app
            src-tauri/target/debug/bundle/msi/*.msi
            src-tauri/target/debug/bundle/nsis/*.exe
